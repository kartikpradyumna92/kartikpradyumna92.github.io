# Site-wide settings. Personal content lives in _data/ and _projects/.
title: Karteek Pradyumna Bulusu
tagline: Full-Stack Data Scientist — Experimentation, Causal Inference & Product Analytics
description: >-
  Full-stack data scientist with 8+ years in healthcare and retail: data
  modeling and KPIs, root-cause and segmentation analysis, forecasting, causal
  inference and experimentation.
url: https://kartikpradyumna92.github.io
baseurl: ""
lang: en-US
timezone: America/Los_Angeles
og_image: /assets/img/og-image.png

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

permalink: pretty

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .serena
  - node_modules
