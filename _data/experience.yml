        - metric: { value: "2×", label: sprint velocity }
          text: >-
            Integrated Cursor and Claude Code into daily development of these
            models, <strong>doubling sprint velocity</strong>.
          tags: [AI-assisted development, Cursor, Claude Code]
        - metric: { value: "+3.5%", label: engagement vs forecast }
