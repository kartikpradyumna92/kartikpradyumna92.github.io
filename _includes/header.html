<header class="site-header" data-header>
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      {% include brand-mark.html %}
      <span class="brand__name">Karteek Bulusu</span><span class="visually-hidden">, home</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span class="nav-toggle__open">{% include icon.html name="menu" %}</span>
      <span class="nav-toggle__close">{% include icon.html name="close" %}</span>
      <span class="nav-toggle__label">Menu</span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Primary" data-nav>
      <ul class="site-nav__list" role="list">
        {%- for item in site.data.nav %}
        <li><a class="site-nav__link" href="{{ '/' | relative_url }}#{{ item.id }}" data-spy="{{ item.id }}">{{ item.label }}</a></li>
        {%- endfor %}
        <li class="site-nav__cta">
          <a class="btn btn--small {% if page.url == '/resume/' %}btn--primary{% else %}btn--secondary{% endif %}" href="{{ '/resume/' | relative_url }}"{% if page.url == '/resume/' %} aria-current="page"{% endif %}>
            {% include icon.html name="file" %}<span>Resume</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
